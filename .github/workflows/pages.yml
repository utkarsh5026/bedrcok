# Publishes the guide in docs/ to GitHub Pages
# (https://utkarsh5026.github.io/bedrcok/).
#
# The site is plain static HTML, so there is no build step: the docs/ folder
# is uploaded as-is. It deploys on every push to main that touches docs/, and
# can be re-run by hand from the Actions tab ("Run workflow").
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". (Until then the deploy job fails with a 404 from Pages.)
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Let a deployment in progress finish, but skip any queued between it and the
# newest one: only the latest docs matter.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Package site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # to publish the site
      id-token: write  # to prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
