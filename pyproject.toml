[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "kbforge"
version = "0.1.0"
description = "Go from a data source to an Amazon Bedrock Knowledge Base in a few notebook cells — with a plan you can read before anything is created."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Utkarsh Priyadarshi" }]
keywords = ["aws", "bedrock", "knowledge-base", "rag", "sagemaker", "jupyter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # S3 Vectors + S3_VECTORS storage type for Bedrock KBs need a recent botocore.
    "boto3>=1.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Interactive form (kbforge.wizard()). SageMaker images usually ship this already.
notebook = ["ipython>=7.0", "ipywidgets>=8.0"]
# Only needed when vector_store="opensearch_serverless" (to create the vector index).
# 2.4.0 itself fails to import without aiohttp, so 2.4.1 is the real minimum.
opensearch = ["opensearch-py>=2.4.1", "requests>=2.31"]
all = ["kbforge[notebook,opensearch]"]

[project.scripts]
kbforge = "kbforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "ipython>=7.0",
    "ipywidgets>=8.0",
    "opensearch-py>=2.4.1",
    "requests>=2.31",
    "rich>=13.0",
]
# Regenerating the GitHub Pages screenshots: uv run --group docs python scripts/docs_screenshots.py
docs = [
    "nbformat>=5.9",
    "playwright>=1.40",
    "jupyterlab>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kbforge"]

[tool.hatch.build.targets.sdist]
include = ["src/kbforge", "tests", "examples", "notebooks", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List: easier to read for newcomers

[tool.ruff.lint.per-file-ignores]
"src/kbforge/ui/theme.py" = ["E501"]  # the stylesheet reads better one rule per line
"src/kbforge/ui/wizard_style.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "ipywidgets.*", "opensearchpy.*", "IPython.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
include = ["src", "tests"]
extraPaths = ["src"]
